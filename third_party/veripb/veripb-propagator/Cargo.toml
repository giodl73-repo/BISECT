[package]
name = "veripb-propagator"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "VeriPB library for a pseudo-Boolean propagation engine."


[dependencies]
ahash = { version = "0.8.12", default-features = false, features = ["std", "no-rng"] }
colored = "3.1.1"
malachite-bigint = "0.10.0"
by_address = "1.2.1"
thiserror = "2.0.20"

[dependencies.veripb-formula]
version = "0.1.2"
path = "../veripb-formula"


[lib]
name = "veripb_propagator"
path = "src/lib.rs"
crate-type = ["rlib"]
