[package]
name = "veripb-rules"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Data structures for VeriPB rules."

[dependencies]
itertools = "0.15.0"
# Rendering LaTeX in docs.
katexit = "0.1.5"
