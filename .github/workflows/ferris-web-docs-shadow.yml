name: Ferris Web Docs Shadow

on:
  pull_request:
    branches: [main, master]
    paths:
      - "web/docs/**"
      - ".github/workflows/ferris-web-docs-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-docs:
    name: Web docs owner validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out BISECT
        uses: actions/checkout@v4

      - name: Check out pinned Ferris
        uses: actions/checkout@v4
        with:
          repository: giodl73-repo/FERRIS
          ref: 1aef069f00ace2567c9610c79820eb437cb4b3a3
          path: ferris
          sparse-checkout: |
            Cargo.toml
            Cargo.lock
            crates
          sparse-checkout-cone-mode: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Ferris
        run: cargo build --locked --manifest-path ferris/Cargo.toml -p ferris-cli --bin ferris

      - name: Record Ferris conservative plan
        run: |
          ./ferris/target/debug/ferris validation-plan \
            --workspace-id giodl73-repo/BISECT \
            --manifest-path Cargo.toml \
            --changed-path web/docs/package.json \
            --format json > ferris-web-docs-plan.json

      - name: Prove the current non-Cargo fallback
        run: |
          node -e "const p=require('./ferris-web-docs-plan.json'); const i=p.record.inputs; if (i.length !== 1 || i[0].disposition !== 'full_workspace_fallback' || !p.record.fallback.required_by_inputs) process.exit(1)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/docs/package-lock.json

      - name: Install web docs dependencies
        working-directory: web/docs
        run: npm ci

      - name: Build web docs
        working-directory: web/docs
        run: npm run build

      - name: Write owner receipt
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          node -e "const fs=require('fs'); const p=require('./ferris-web-docs-plan.json'); fs.writeFileSync('web-docs-owner-receipt.json', JSON.stringify({schema:'bisect.owner-validation-receipt/v0', owner:'web/docs', entrypoint:'npm run build', source_revision:process.env.SOURCE_REVISION, status:'passed', ferris_validation_plan_id:p.record.validation_plan_id, ferris_input_disposition:p.record.inputs[0].disposition}, null, 2)+'\n')"

      - name: Retain shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: ferris-web-docs-shadow
          path: |
            ferris-web-docs-plan.json
            web-docs-owner-receipt.json

