[package]
name = "bisect-report"
version = "0.1.0"
edition = "2021"
authors = ["Gio Della-Libera"]
license = "MIT"
description = "RPLAN format, PlanManifest, validate/migrate, report/export/import for BISECT CLI"

[features]
default = ["filesystem"]
polygon-import = ["interchange", "dep:geo"]
report-render = ["interchange", "dep:tera"]
label-import = ["interchange", "dep:shapefile"]
interchange = ["dep:bisect-core", "dep:rplan-core", "dep:rplan-io", "dep:anyhow", "dep:csv", "dep:base64"]
filesystem = ["label-import","dep:bisect-core", "dep:rplan-core", "dep:rplan-io", "dep:anyhow", "dep:hex", "dep:chrono", "dep:tempfile", "dep:tera", "tera/builtins", "dep:geojson", "dep:geo", "dep:geo-types", "dep:base64", "dep:csv"]

[dependencies]
bisect-analysis = { path = "../bisect-analysis" }
bisect-core = { path = "../bisect-core", optional = true }
rplan-core = { path = "../rplan-core", optional = true }
rplan-io = { path = "../rplan-io", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror.workspace = true
anyhow = { version = "1", optional = true }
sha2 = "0.10"
hex = { version = "0.4", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
tempfile = { version = "3", optional = true }
# Spec 6: report + export + import
tera = { version = "1", optional = true, default-features = false }
geojson = { version = "0.24", optional = true }
geo = { version = "0.28", features = ["use-serde"], optional = true }
geo-types = { version = "0.7", optional = true }
base64 = { version = "0.22", optional = true }
csv = { version = "1", optional = true }

shapefile = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3"
