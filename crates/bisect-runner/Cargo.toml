[package]
name = "bisect-runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "bisect redistricting engine — recursive bisection runner extracted from the CLI"

[dependencies]
anyhow.workspace = true
bisect-core      = { path = "../bisect-core" }
bisect-apportion = { path = "../bisect-apportion", default-features = false }
bisect-data      = { path = "../bisect-data" }
bisect-ensemble  = { path = "../bisect-ensemble" }
bisect-ilp       = { path = "../bisect-ilp" }
bisect-multiscale = { path = "../bisect-multiscale" }
bisect-smc       = { path = "../bisect-smc" }
metis-core       = { workspace = true }
rgraph-core      = { path = "../rgraph-core" }
rmath-core       = { path = "../rmath-core" }
rplan-core = { path = "../rplan-core" }
# metis is only compiled when the c-ffi-engine feature is enabled.
metis            = { workspace = true, optional = true }
metis-sidecar = { package = "bisect-metis-sidecar", path = "../bisect-metis-sidecar", optional = true }
rand.workspace        = true
rand_chacha = "0.3"
rayon.workspace       = true
serde.workspace       = true
# Native companion coordinates must use the same correctly rounded decimal
# parser as the WASM engine; target-dependent fast parsing changes some ULPs.
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_yaml = "0.9"
sha2           = "0.10"
clap           = { version = "4", features = ["derive"] }

[features]
# c-ffi-engine: enables C METIS (the `metis` FFI crate). Disable with
# --no-default-features for a fully pure-Rust build (no C toolchain needed).
c-ffi-engine = ["dep:metis", "bisect-apportion/c-ffi"]
wasm-c-ffi = ["dep:metis-sidecar", "bisect-apportion/wasm-c-ffi"]
default = ["c-ffi-engine"]

[dev-dependencies]
tempfile = "3"
